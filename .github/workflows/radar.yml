# Giro orario del radar dei trend su X (vedi docs/RADAR.md).
# Il piano Hobby di Vercel permette un solo cron al giorno, quindi la chiamata parte da qui.
# Fuori dall'orario di lavoro del radar (RADAR_ORARIO, predefinito 10-22 italiane) la chiamata
# torna subito e non costa nulla, quindi il giro parte ogni ora tutto il giorno.
name: Radar

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  giro:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama il radar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET non impostato fra i segreti del repository"
            exit 1
          fi
          codice=$(curl -s -S -m 300 -o risposta.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://politicare-app.vercel.app/api/radar)
          # Il repository è pubblico e questi log sono visibili a tutti:
          # si stampa solo l'esito, mai le bozze o il contenuto della risposta.
          esito=$(node -e 'const r=require("./risposta.json");console.log(r.ok?(r.nota??"giro eseguito"):("errore: "+r.error))' 2>/dev/null || echo "risposta non leggibile")
          echo "HTTP $codice — $esito"
          [ "$codice" = "200" ]
