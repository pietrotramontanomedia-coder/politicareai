# Avviso di chi coordina nel gruppo Telegram della redazione, mandato dal bot della redazione.
# Actions → «Avviso redazione» → Run workflow, con il testo (a capo con \n).
name: Avviso redazione

on:
  workflow_dispatch:
    inputs:
      testo:
        description: Testo dell'avviso (a capo con \n)
        required: true

jobs:
  avviso:
    runs-on: ubuntu-latest
    steps:
      - name: Manda l'avviso
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TESTO: ${{ inputs.testo }}
        run: |
          corpo=$(python3 -c 'import json,os; print(json.dumps({"testo": os.environ["TESTO"].replace("\\n", "\n")}))')
          codice=$(curl -s -S -m 60 -o risposta.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
            --data "$corpo" https://politicare-app.vercel.app/api/redazione/telegram)
          echo "HTTP $codice"; cat risposta.json
          [ "$codice" = "200" ]
